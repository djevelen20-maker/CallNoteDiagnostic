name: Build CallNote AI APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download Whisper model assets
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 https://raw.githubusercontent.com/vilassn/whisper_android/master/whisper_java/app/src/main/assets/whisper-tiny.tflite -o app/src/main/assets/whisper-tiny.tflite
          curl -L --fail --retry 3 https://raw.githubusercontent.com/vilassn/whisper_android/master/whisper_java/app/src/main/assets/filters_vocab_multilingual.bin -o app/src/main/assets/filters_vocab_multilingual.bin

      - name: Build APK
        run: |
          gradle assembleDebug --stacktrace \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CallNote-AI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

